<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>LashMenu — Estúdio de Vídeos de Anúncios (Mockup iPhone)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0807;
      --card-bg: #14100e;
      --accent-rose: #e65073;
      --accent-gold: #c9a389;
      --border-color: rgba(201, 163, 137, 0.25);
      --text-main: #f3efe9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-x: hidden;
    }

    /* ── Top Header Studio ── */
    .studio-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .studio-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 600;
      color: #ffffff;
    }

    .studio-title em {
      font-style: italic;
      color: var(--accent-gold);
    }

    .studio-subtitle {
      font-size: 0.9rem;
      color: rgba(243, 239, 233, 0.7);
      max-width: 600px;
    }

    /* ── Tabs de Seleção de Modelo ── */
    .model-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 6px;
      border-radius: 100px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: rgba(243, 239, 233, 0.7);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .tab-btn.is-active {
      background: linear-gradient(135deg, var(--accent-gold) 0%, #a87e63 100%);
      color: #000000;
      box-shadow: 0 4px 15px rgba(201, 163, 137, 0.4);
    }

    .tab-btn--midnight.is-active {
      background: linear-gradient(135deg, #2b1f25 0%, #150e12 100%);
      color: #ffb5c5;
      border: 1px solid rgba(255, 181, 197, 0.3);
      box-shadow: 0 4px 15px rgba(230, 80, 115, 0.3);
    }

    /* ── Barra de Controles da Animação ── */
    .studio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      transition: opacity 0.3s ease;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 100px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .ctrl-btn--play {
      background: #25d366;
      color: #000000;
      border: none;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    }
    .ctrl-btn--play:hover {
      background: #28e16f;
    }

    .ctrl-btn--rec {
      background: var(--accent-rose);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 15px rgba(230, 80, 115, 0.4);
    }

    .bg-mode-select {
      background: #14100e;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    /* ── PALCO DE GRAVAÇÃO (STUDIO STAGE) ── */
    .studio-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 32px;
      transition: all 0.4s ease;
      background: radial-gradient(circle, rgba(201, 163, 137, 0.08) 0%, transparent 70%);
    }

    /* Modos de Fundo */
    body.bg-dark .studio-stage { background: radial-gradient(circle, rgba(201, 163, 137, 0.08) 0%, transparent 70%); }
    body.bg-green .studio-stage { background: #00ff00; }
    body.bg-black .studio-stage { background: #000000; }

    /* MOCKUP DO IPHONE 16 PRO REALISTA */
    .testdrive-phone {
      position: relative;
      width: 390px;
      height: 844px;
      background: #0d0b0a;
      border-radius: 50px;
      border: 12px solid #231b19;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 255, 255, 0.1), inset 0 0 0 2px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      transform-origin: center center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .testdrive-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #000000;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notch-camera {
      width: 12px;
      height: 12px;
      background: #0b0d12;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .testdrive-screen-scaler {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 844px;
      border-radius: 38px;
      overflow: hidden;
    }

    .testdrive-screen-scaler iframe {
      width: 390px !important;
      height: 844px !important;
      border: none;
      background: #0d0b0a;
    }

    /* ── CURSOR DE TOQUE SIMULADO (SIMULATED TOUCH POINTER) ── */
    #simulated-touch {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(230, 80, 115, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 20px rgba(230, 80, 115, 0.8);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #simulated-touch.is-active {
      opacity: 1;
    }

    #simulated-touch.is-tapping {
      transform: translate(-50%, -50%) scale(0.75);
      background: rgba(230, 80, 115, 0.85);
    }

    #simulated-touch::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--accent-rose);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.35s ease;
    }

    #simulated-touch.is-tapping::after {
      opacity: 1;
      transform: scale(1.6);
    }

    /* ── Modo Gravação Fullscreen / Clean Focus ── */
    body.recording-mode .studio-header,
    body.recording-mode .studio-controls,
    body.recording-mode .exit-rec-btn {
      opacity: 0;
      pointer-events: none;
    }

    .exit-rec-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--accent-rose);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 10000;
      display: none;
    }

    body.recording-mode .exit-rec-btn {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 480px) {
      .testdrive-phone {
        width: 320px;
        height: 692px;
      }
      .testdrive-screen-scaler {
        transform: scale(0.82051);
        transform-origin: top left;
      }
    }
  </style>
</head>

<body class="bg-dark">

  <!-- Header -->
  <div class="studio-header">
    <h1 class="studio-title">Estúdio de <em>Vídeos de Anúncios</em></h1>
    <p class="studio-subtitle">Simule a experiência real do LashMenu no mockup de iPhone para gravar vídeos de alta conversão para o Instagram Reels, TikTok e Meta Ads.</p>

    <!-- Tabs de Modelos -->
    <div class="model-tabs">
      <button class="tab-btn tab-btn--midnight is-active" data-model="glamour-midnight" data-url="/glamour-midnight/">
        🖤 Modelo 01: Glamour (Midnight)
      </button>
      <button class="tab-btn" data-model="harmonia-rose" data-url="/harmonia-rose/">
        🌸 Modelo 02: Harmonia (Rosé)
      </button>
      <button class="tab-btn" data-model="classico-rose" data-url="/classico-rose/">
        👑 Modelo 03: Clássico (Rosé)
      </button>
    </div>
  </div>

  <!-- Controles da Animação Automática -->
  <div class="studio-controls">
    <button class="ctrl-btn ctrl-btn--play" id="btn-play-sim">
      ▶️ Iniciar Simulação Automática
    </button>
    <button class="ctrl-btn" id="btn-pause-sim">
      ⏸️ Pausar
    </button>
    <button class="ctrl-btn" id="btn-reset-sim">
      🔄 Reiniciar
    </button>
    <button class="ctrl-btn ctrl-btn--rec" id="btn-toggle-rec">
      🎬 Modo Gravação (Tela Cheia)
    </button>
    <select class="bg-mode-select" id="bg-selector">
      <option value="bg-dark">Fundo: Studio Escuro</option>
      <option value="bg-black">Fundo: Preto Puro (100% Black)</option>
      <option value="bg-green">Fundo: Chroma Key (Verde)</option>
    </select>
  </div>

  <!-- Botão para Sair do Modo Gravação -->
  <button class="exit-rec-btn" id="btn-exit-rec">❌ Sair do Modo Gravação (ESC)</button>

  <!-- Palco com o Mockup de iPhone -->
  <div class="studio-stage">
    <div class="testdrive-phone">
      <div class="testdrive-notch">
        <div class="notch-camera"></div>
      </div>
      
      <div class="testdrive-screen-scaler">
        <iframe id="studio-iframe" src="/glamour-midnight/" title="Preview LashMenu"></iframe>
      </div>

      <!-- Cursor de Toque Simulado -->
      <div id="simulated-touch"></div>
    </div>
  </div>

  <!-- Script da Animação Automática e Interatividade -->
  <script>
    const iframe = document.getElementById('studio-iframe');
    const touch = document.getElementById('simulated-touch');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const btnPlay = document.getElementById('btn-play-sim');
    const btnPause = document.getElementById('btn-pause-sim');
    const btnReset = document.getElementById('btn-reset-sim');
    const btnRec = document.getElementById('btn-toggle-rec');
    const btnExitRec = document.getElementById('btn-exit-rec');
    const bgSelector = document.getElementById('bg-selector');

    let animInterval = null;
    let isRunning = false;
    let animStep = 0;

    // Seleção de Modelos
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('is-active', 'tab-btn--midnight'));
        btn.classList.add('is-active');
        if (btn.dataset.model.includes('midnight')) {
          btn.classList.add('tab-btn--midnight');
        }
        iframe.src = btn.dataset.url;
        resetSimulation();
      });
    });

    // Seletor de Fundo
    bgSelector.addEventListener('change', (e) => {
      document.body.className = e.target.value;
      if (document.body.classList.contains('recording-mode')) {
        document.body.classList.add('recording-mode');
      }
    });

    // Modo Gravação Fullscreen
    btnRec.addEventListener('click', () => {
      document.body.classList.add('recording-mode');
      if (!isRunning) startSimulation();
    });

    btnExitRec.addEventListener('click', () => {
      document.body.classList.remove('recording-mode');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.body.classList.remove('recording-mode');
      }
    });

    // ── LÓGICA DA ANIMAÇÃO AUTOMÁTICA DA TELA ──
    function moveTouch(x, y, duration = 600, callback) {
      touch.classList.add('is-active');
      touch.style.transition = `all ${duration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
      touch.style.left = `${x}px`;
      touch.style.top = `${y}px`;
      
      setTimeout(() => {
        if (callback) callback();
      }, duration);
    }

    function tapTouch(callback) {
      touch.classList.add('is-tapping');
      setTimeout(() => {
        touch.classList.remove('is-tapping');
        if (callback) callback();
      }, 300);
    }

    function hideTouch() {
      touch.classList.remove('is-active');
    }

    function scrollIframeTo(targetY, duration = 1200, callback) {
      try {
        const win = iframe.contentWindow;
        const startY = win.scrollY;
        const diff = targetY - startY;
        const startTime = performance.now();

        function step(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // EaseInOutCubic
          const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
          win.scrollTo(0, startY + diff * ease);

          if (progress < 1 && isRunning) {
            requestAnimationFrame(step);
          } else if (callback) {
            callback();
          }
        }
        requestAnimationFrame(step);
      } catch (err) {
        if (callback) callback();
      }
    }

    function runNextStep() {
      if (!isRunning) return;

      switch (animStep) {
        case 0:
          // Passo 0: Início no topo do catálogo
          scrollIframeTo(0, 500, () => {
            moveTouch(195, 250, 700, () => {
              setTimeout(() => { animStep++; runNextStep(); }, 800);
            });
          });
          break;

        case 1:
          // Passo 1: Rolar suavemente para baixo para mostrar a lista de procedimentos
          scrollIframeTo(420, 1800, () => {
            setTimeout(() => { animStep++; runNextStep(); }, 600);
          });
          break;

        case 2:
          // Passo 2: Mover o cursor até o 1º Card de Serviço (ex: Volume Brasileiro)
          moveTouch(195, 380, 800, () => {
            tapTouch(() => {
              // Tenta clicar no primeiro card do iframe
              try {
                const doc = iframe.contentWindow.document;
                const card = doc.querySelector('.service-card, .menu-item-card, .catalog-card');
                if (card) card.click();
              } catch(e){}
              
              setTimeout(() => { animStep++; runNextStep(); }, 1000);
            });
          });
          break;

        case 3:
          // Passo 3: Rolar mais para baixo mostrando fotos e tempo de cabine
          scrollIframeTo(950, 2200, () => {
            setTimeout(() => { animStep++; runNextStep(); }, 800);
          });
          break;

        case 4:
          // Passo 4: Mover até o botão de agendamento no WhatsApp
          moveTouch(195, 680, 800, () => {
            tapTouch(() => {
              setTimeout(() => { animStep++; runNextStep(); }, 1200);
            });
          });
          break;

        case 5:
          // Passo 5: Rolar de volta para o topo e reiniciar o loop
          hideTouch();
          scrollIframeTo(0, 1500, () => {
            animStep = 0;
            setTimeout(() => { runNextStep(); }, 1500);
          });
          break;
      }
    }

    function startSimulation() {
      if (isRunning) return;
      isRunning = true;
      btnPlay.style.display = 'none';
      btnPause.style.display = 'inline-flex';
      runNextStep();
    }

    function pauseSimulation() {
      isRunning = false;
      btnPlay.style.display = 'inline-flex';
      btnPause.style.display = 'none';
      hideTouch();
    }

    function resetSimulation() {
      pauseSimulation();
      animStep = 0;
      hideTouch();
      try {
        iframe.contentWindow.scrollTo(0, 0);
      } catch(e){}
    }

    btnPlay.addEventListener('click', startSimulation);
    btnPause.addEventListener('click', pauseSimulation);
    btnReset.addEventListener('click', resetSimulation);
  </script>
</body>

</html>
