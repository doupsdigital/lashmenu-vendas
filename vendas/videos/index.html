<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>LashMenu — Estúdio de Gravação (Mockup iPhone)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0b0a;
      --bg-light: #faf6f0;
      --accent-rose: #e65073;
      --accent-gold: #c9a389;
      --border-color: rgba(201, 163, 137, 0.25);
      --text-main: #f3efe9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-light);
      color: #1a1412;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Modos de Fundo */
    body.bg-light { background: linear-gradient(135deg, #faf6f0 0%, #f4ede4 100%); color: #1a1412; }
    body.bg-dark { background: #0d0b0a; color: #f3efe9; }
    body.bg-black { background: #000000; color: #ffffff; }
    body.bg-green { background: #00ff00; color: #000000; }

    /* ── Top Header Studio ── */
    .studio-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .studio-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 2.5vw, 2.2rem);
      font-weight: 600;
    }

    body.bg-light .studio-title { color: #1a1412; }
    body.bg-dark .studio-title { color: #ffffff; }

    .studio-title em {
      font-style: italic;
      color: var(--accent-rose);
    }

    .studio-subtitle {
      font-size: 0.85rem;
      opacity: 0.8;
      max-width: 650px;
    }

    /* ── Tabs de Seleção de Modelo ── */
    .model-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(230, 80, 115, 0.2);
      padding: 5px;
      border-radius: 100px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      flex-wrap: wrap;
    }

    body.bg-light .model-tabs {
      background: #ffffff;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: inherit;
      opacity: 0.7;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      opacity: 1;
      background: rgba(230, 80, 115, 0.08);
    }

    .tab-btn.is-active {
      opacity: 1;
      background: linear-gradient(135deg, var(--accent-rose) 0%, #c43b5c 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(230, 80, 115, 0.35);
    }

    .tab-btn--midnight.is-active {
      background: linear-gradient(135deg, #1f1719 0%, #0d090a 100%);
      color: #ffb5c5 !important;
      border: 1px solid rgba(255, 181, 197, 0.3);
    }

    /* ── Barra de Controles ── */
    .studio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      transition: opacity 0.3s ease;
    }

    .ctrl-btn {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: inherit;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 100px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    body.bg-dark .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .ctrl-btn:hover {
      transform: translateY(-1px);
    }

    .ctrl-btn--rec {
      background: var(--accent-rose) !important;
      color: #ffffff !important;
      border: none !important;
      box-shadow: 0 4px 15px rgba(230, 80, 115, 0.4);
    }

    .bg-mode-select {
      background: #ffffff;
      color: #1a1412;
      border: 1px solid rgba(0, 0, 0, 0.15);
      padding: 8px 12px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      outline: none;
    }

    body.bg-dark .bg-mode-select {
      background: #14100e;
      color: #ffffff;
      border-color: var(--border-color);
    }

    /* ── PALCO DE GRAVAÇÃO (STUDIO STAGE) ── */
    .studio-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      width: 100%;
      height: min(844px, 84vh);
    }

    /* MOCKUP DO IPHONE PRETO REAL — ENQUADRAMENTO E PREENCHIMENTO 100% NATIVO SEM SOBRA EM BAIXO */
    .testdrive-phone {
      position: relative;
      height: 100%;
      aspect-ratio: 390 / 844;
      width: auto;
      background: #000000;
      border: 5px solid #000000;
      border-radius: 46px;
      overflow: hidden;
      clip-path: inset(0 round 40px);
      -webkit-clip-path: inset(0 round 40px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
      margin: 0 auto;
    }

    .testdrive-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 16px;
      background: #000000;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 100;
      pointer-events: none;
    }

    /* Scaler container preenchendo 100% a área do iPhone sem sobramar barras pretas */
    .testdrive-screen-scaler {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      clip-path: inset(0 round 40px);
      -webkit-clip-path: inset(0 round 40px);
    }

    .testdrive-screen-scaler iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
      background: #0d0b0a;
    }

    /* ── Modo Gravação Fullscreen (BOTAO SAIR NO TOPO SUPERIOR DIREITO FORA DO CELULAR) ── */
    body.recording-mode .studio-header,
    body.recording-mode .studio-controls {
      opacity: 0;
      pointer-events: none;
    }

    .exit-rec-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid var(--accent-rose);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      z-index: 999999;
      display: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    body.recording-mode .exit-rec-btn {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body class="bg-light">

  <!-- Header -->
  <div class="studio-header">
    <h1 class="studio-title">Estúdio de <em>Gravação de Vídeos</em></h1>
    <p class="studio-subtitle">Simule o uso real do LashMenu no mockup de iPhone para gravar seus vídeos diretamente pelo celular ou computador.</p>

    <!-- Tabs de Modelos -->
    <div class="model-tabs">
      <button class="tab-btn tab-btn--midnight" data-model="glamour-midnight" data-url="../../glamour-midnight/index.html?interactive=1">
        🖤 Modelo 01: Glamour (Midnight)
      </button>
      <button class="tab-btn is-active" data-model="harmonia-rose" data-url="../../harmonia-rose/index.html?interactive=1">
        🌸 Modelo 02: Harmonia (Rosé)
      </button>
      <button class="tab-btn" data-model="classico-rose" data-url="../../classico-rose/index.html?interactive=1">
        👑 Modelo 03: Clássico (Rosé)
      </button>
    </div>
  </div>

  <!-- Controles -->
  <div class="studio-controls">
    <button class="ctrl-btn ctrl-btn--rec" id="btn-toggle-rec">
      🎬 Modo Gravação (Tela Cheia)
    </button>
    <select class="bg-mode-select" id="bg-selector">
      <option value="bg-light" selected>Fundo: Claro Nude/Rosé (Página de Vendas)</option>
      <option value="bg-dark">Fundo: Studio Escuro</option>
      <option value="bg-black">Fundo: Preto Puro (100% Black)</option>
      <option value="bg-green">Fundo: Chroma Key (Verde)</option>
    </select>
  </div>

  <!-- Botão para Sair do Modo Gravação (Fora da Tela do Celular) -->
  <button class="exit-rec-btn" id="btn-exit-rec">❌ Sair do Modo Gravação (ESC)</button>

  <!-- Palco com o Mockup de iPhone Interativo (Sem barra preta em baixo) -->
  <div class="studio-stage">
    <div class="testdrive-phone">
      <div class="testdrive-notch"></div>
      
      <div class="testdrive-screen-scaler">
        <iframe id="studio-iframe" src="../../harmonia-rose/index.html?interactive=1" title="Preview LashMenu" allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <!-- Script Interativo e de Modos -->
  <script>
    const iframe = document.getElementById('studio-iframe');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const btnRec = document.getElementById('btn-toggle-rec');
    const btnExitRec = document.getElementById('btn-exit-rec');
    const bgSelector = document.getElementById('bg-selector');

    // Seleção de Modelos
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('is-active', 'tab-btn--midnight'));
        btn.classList.add('is-active');
        if (btn.dataset.model.includes('midnight')) {
          btn.classList.add('tab-btn--midnight');
        }
        iframe.src = btn.dataset.url;
      });
    });

    // Seletor de Fundo
    bgSelector.addEventListener('change', (e) => {
      document.body.className = e.target.value;
      if (document.body.classList.contains('recording-mode')) {
        document.body.classList.add('recording-mode');
      }
    });

    // Modo Gravação Fullscreen
    btnRec.addEventListener('click', () => {
      document.body.classList.add('recording-mode');
    });

    btnExitRec.addEventListener('click', () => {
      document.body.classList.remove('recording-mode');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.body.classList.remove('recording-mode');
      }
    });
  </script>
</body>

</html>
