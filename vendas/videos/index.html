<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>LashMenu — Estúdio de Vídeos de Anúncios (Mockup iPhone Realista)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0b0a;
      --bg-light: #faf6f0;
      --accent-rose: #e65073;
      --accent-gold: #c9a389;
      --border-color: rgba(201, 163, 137, 0.25);
      --text-main: #f3efe9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-light);
      color: #1a1412;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Modos de Fundo */
    body.bg-light { background: linear-gradient(135deg, #faf6f0 0%, #f4ede4 100%); color: #1a1412; }
    body.bg-dark { background: #0d0b0a; color: #f3efe9; }
    body.bg-black { background: #000000; color: #ffffff; }
    body.bg-green { background: #00ff00; color: #000000; }

    /* ── Top Header Studio ── */
    .studio-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .studio-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 600;
    }

    body.bg-light .studio-title { color: #1a1412; }
    body.bg-dark .studio-title { color: #ffffff; }

    .studio-title em {
      font-style: italic;
      color: var(--accent-rose);
    }

    .studio-subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
      max-width: 650px;
    }

    /* ── Tabs de Seleção de Modelo ── */
    .model-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(230, 80, 115, 0.2);
      padding: 6px;
      border-radius: 100px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      flex-wrap: wrap;
    }

    body.bg-light .model-tabs {
      background: #ffffff;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: inherit;
      opacity: 0.7;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      opacity: 1;
      background: rgba(230, 80, 115, 0.08);
    }

    .tab-btn.is-active {
      opacity: 1;
      background: linear-gradient(135deg, var(--accent-rose) 0%, #c43b5c 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(230, 80, 115, 0.35);
    }

    .tab-btn--midnight.is-active {
      background: linear-gradient(135deg, #1f1719 0%, #0d090a 100%);
      color: #ffb5c5 !important;
      border: 1px solid rgba(255, 181, 197, 0.3);
    }

    /* ── Barra de Controles da Animação ── */
    .studio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      transition: opacity 0.3s ease;
    }

    .ctrl-btn {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: inherit;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 100px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    body.bg-dark .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .ctrl-btn:hover {
      transform: translateY(-1px);
    }

    .ctrl-btn--play {
      background: #25d366 !important;
      color: #000000 !important;
      border: none !important;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    }
    .ctrl-btn--play:hover {
      background: #28e16f !important;
    }

    .ctrl-btn--rec {
      background: var(--accent-rose) !important;
      color: #ffffff !important;
      border: none !important;
      box-shadow: 0 4px 15px rgba(230, 80, 115, 0.4);
    }

    .bg-mode-select {
      background: #ffffff;
      color: #1a1412;
      border: 1px solid rgba(0, 0, 0, 0.15);
      padding: 9px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    body.bg-dark .bg-mode-select {
      background: #14100e;
      color: #ffffff;
      border-color: var(--border-color);
    }

    /* ── PALCO DE GRAVAÇÃO (STUDIO STAGE) ── */
    .studio-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      width: 100%;
      max-width: 480px;
      height: 840px;
    }

    /* EXATO MOCKUP DE IPHONE DO MODAL DE TESTES DA LANDING PAGE (390px SCALER NATIVO) */
    .testdrive-phone {
      position: relative;
      height: 100%;
      max-height: 840px;
      aspect-ratio: 9 / 19.2;
      width: auto;
      background: #000000;
      border: 5px solid #000000; /* Preto puro 100% de iPhone */
      border-radius: 40px;
      overflow: hidden;
      clip-path: inset(0 round 36px);
      -webkit-clip-path: inset(0 round 36px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      margin: 0 auto;
    }

    .testdrive-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 20px;
      background: #000000;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 100;
      pointer-events: none;
    }

    /* Scaler container idêntico ao modal de testes que força resolução nativa de 390px sem quebrar fontes ou layouts */
    .testdrive-screen-scaler {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 844px;
      transform-origin: top left;
      border-radius: 34px;
      overflow: hidden;
      clip-path: inset(0 round 34px);
      -webkit-clip-path: inset(0 round 34px);
    }

    .testdrive-screen-scaler iframe {
      width: 390px !important;
      height: 844px !important;
      border: none;
      background: #0d0b0a;
      border-radius: 34px;
      overflow: hidden;
      clip-path: inset(0 round 34px);
      -webkit-clip-path: inset(0 round 34px);
    }

    /* ── CURSOR DE TOQUE SIMULADO DE ALTA CONVERSÃO ── */
    #simulated-touch {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(230, 80, 115, 0.6);
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px rgba(230, 80, 115, 0.9);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #simulated-touch.is-active {
      opacity: 1;
    }

    #simulated-touch.is-tapping {
      transform: translate(-50%, -50%) scale(0.7);
      background: rgba(230, 80, 115, 0.95);
    }

    /* ── Modo Gravação Fullscreen ── */
    body.recording-mode .studio-header,
    body.recording-mode .studio-controls {
      opacity: 0;
      pointer-events: none;
    }

    .exit-rec-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-rose);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 10000;
      display: none;
    }

    body.recording-mode .exit-rec-btn {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body class="bg-light">

  <!-- Header -->
  <div class="studio-header">
    <h1 class="studio-title">Estúdio de <em>Vídeos de Anúncios</em></h1>
    <p class="studio-subtitle">Simule a experiência real do LashMenu no mockup de iPhone com resolução nativa idêntica ao modal de testes da Landing Page.</p>

    <!-- Tabs de Modelos -->
    <div class="model-tabs">
      <button class="tab-btn tab-btn--midnight" data-model="glamour-midnight" data-url="../../glamour-midnight/index.html?interactive=1">
        🖤 Modelo 01: Glamour (Midnight)
      </button>
      <button class="tab-btn is-active" data-model="harmonia-rose" data-url="../../harmonia-rose/index.html?interactive=1">
        🌸 Modelo 02: Harmonia (Rosé)
      </button>
      <button class="tab-btn" data-model="classico-rose" data-url="../../classico-rose/index.html?interactive=1">
        👑 Modelo 03: Clássico (Rosé)
      </button>
    </div>
  </div>

  <!-- Controles da Animação Automática -->
  <div class="studio-controls">
    <button class="ctrl-btn ctrl-btn--play" id="btn-play-sim">
      ▶️ Iniciar Simulação Automática
    </button>
    <button class="ctrl-btn" id="btn-pause-sim" style="display: none;">
      ⏸️ Pausar
    </button>
    <button class="ctrl-btn" id="btn-reset-sim">
      🔄 Reiniciar
    </button>
    <button class="ctrl-btn ctrl-btn--rec" id="btn-toggle-rec">
      🎬 Modo Gravação (Tela Cheia)
    </button>
    <select class="bg-mode-select" id="bg-selector">
      <option value="bg-light" selected>Fundo: Claro Nude/Rosé (Página de Vendas)</option>
      <option value="bg-dark">Fundo: Studio Escuro</option>
      <option value="bg-black">Fundo: Preto Puro (100% Black)</option>
      <option value="bg-green">Fundo: Chroma Key (Verde)</option>
    </select>
  </div>

  <!-- Botão para Sair do Modo Gravação -->
  <button class="exit-rec-btn" id="btn-exit-rec">❌ Sair do Modo Gravação (ESC)</button>

  <!-- Palco com o Mockup de iPhone -->
  <div class="studio-stage">
    <div class="testdrive-phone">
      <div class="testdrive-notch"></div>
      
      <div class="testdrive-screen-scaler">
        <iframe id="studio-iframe" src="../../harmonia-rose/index.html?interactive=1" title="Preview LashMenu"></iframe>
      </div>

      <!-- Cursor de Toque Simulado -->
      <div id="simulated-touch"></div>
    </div>
  </div>

  <!-- Script de Dimensionamento Exato e Animação Automática -->
  <script>
    const iframe = document.getElementById('studio-iframe');
    const touch = document.getElementById('simulated-touch');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const btnPlay = document.getElementById('btn-play-sim');
    const btnPause = document.getElementById('btn-pause-sim');
    const btnReset = document.getElementById('btn-reset-sim');
    const btnRec = document.getElementById('btn-toggle-rec');
    const btnExitRec = document.getElementById('btn-exit-rec');
    const bgSelector = document.getElementById('bg-selector');

    let isRunning = false;
    let animStep = 0;
    let stepTimer = null;

    // SCALER DINÂMICO IDÊNTICO AO MODAL DE TESTES DA LANDING PAGE
    function updateIframeScale() {
      const phone = document.querySelector('.testdrive-phone');
      const scaler = document.querySelector('.testdrive-screen-scaler');
      if (!phone || !scaler) return;
      const phoneWidth = phone.clientWidth;
      if (phoneWidth > 0) {
        const scale = phoneWidth / 390;
        scaler.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener('resize', updateIframeScale);
    setTimeout(updateIframeScale, 50);
    setTimeout(updateIframeScale, 300);

    // Seleção de Modelos
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('is-active', 'tab-btn--midnight'));
        btn.classList.add('is-active');
        if (btn.dataset.model.includes('midnight')) {
          btn.classList.add('tab-btn--midnight');
        }
        iframe.src = btn.dataset.url;
        setTimeout(updateIframeScale, 150);
        resetSimulation();
      });
    });

    // Seletor de Fundo
    bgSelector.addEventListener('change', (e) => {
      document.body.className = e.target.value;
      if (document.body.classList.contains('recording-mode')) {
        document.body.classList.add('recording-mode');
      }
    });

    // Modo Gravação Fullscreen
    btnRec.addEventListener('click', () => {
      document.body.classList.add('recording-mode');
      setTimeout(updateIframeScale, 50);
      if (!isRunning) startSimulation();
    });

    btnExitRec.addEventListener('click', () => {
      document.body.classList.remove('recording-mode');
      setTimeout(updateIframeScale, 50);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.body.classList.remove('recording-mode');
        setTimeout(updateIframeScale, 50);
      }
    });

    // ── NAVEGAÇÃO E SCROLL AUTOMÁTICO REAIS DO CATÁLOGO ──
    function moveTouch(x, y, duration, callback) {
      touch.classList.add('is-active');
      touch.style.transition = `all ${duration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
      touch.style.left = `${x}px`;
      touch.style.top = `${y}px`;
      
      stepTimer = setTimeout(() => {
        if (callback && isRunning) callback();
      }, duration);
    }

    function tapTouch(callback) {
      touch.classList.add('is-tapping');
      stepTimer = setTimeout(() => {
        touch.classList.remove('is-tapping');
        if (callback && isRunning) callback();
      }, 350);
    }

    function hideTouch() {
      touch.classList.remove('is-active');
    }

    // DISPARO DE SCROLL NATIVO DAS SEÇÕES DO CATÁLOGO
    function scrollCatalogToSection(index, callback) {
      try {
        const win = iframe.contentWindow;
        const doc = win.document;
        const sections = doc.querySelectorAll('.vitrine > section, .mosaico-app section, main section, section');
        
        if (sections.length > 0 && sections[index]) {
          sections[index].scrollIntoView({ behavior: 'smooth' });
        } else if (win.LashMenuApp && typeof win.LashMenuApp.nextSection === 'function') {
          win.LashMenuApp.nextSection();
        } else {
          win.scrollBy({ top: 500, behavior: 'smooth' });
        }
      } catch(e) {}

      stepTimer = setTimeout(() => {
        if (callback && isRunning) callback();
      }, 1600);
    }

    function resetCatalogToTop(callback) {
      try {
        const win = iframe.contentWindow;
        win.scrollTo({ top: 0, behavior: 'smooth' });
      } catch(e) {}

      stepTimer = setTimeout(() => {
        if (callback && isRunning) callback();
      }, 1200);
    }

    // MÁQUINA DE ESTADOS DA SIMULAÇÃO PERFEITA
    function executeStep() {
      if (!isRunning) return;

      switch (animStep) {
        case 0:
          // Passo 0: Capa do catálogo (Ex: Mariana Alves / Nome centralizado)
          resetCatalogToTop(() => {
            moveTouch(195, 260, 700, () => {
              stepTimer = setTimeout(() => {
                if (isRunning) { animStep = 1; executeStep(); }
              }, 1000);
            });
          });
          break;

        case 1:
          // Passo 1: Avançar para a vitrine de serviços/procedimentos
          scrollCatalogToSection(1, () => {
            moveTouch(195, 420, 800, () => {
              tapTouch(() => {
                // Tenta interagir ou abrir modal do serviço no iframe
                try {
                  const doc = iframe.contentWindow.document;
                  const btnDetail = doc.querySelector('.procedimento__btn, .service-btn, .procedimentos__card');
                  if (btnDetail) btnDetail.click();
                } catch(e){}

                stepTimer = setTimeout(() => {
                  if (isRunning) { animStep = 2; executeStep(); }
                }, 1400);
              });
            });
          });
          break;

        case 2:
          // Passo 2: Avançar para os cuidados ou detalhes do cílio
          scrollCatalogToSection(2, () => {
            moveTouch(195, 380, 800, () => {
              stepTimer = setTimeout(() => {
                if (isRunning) { animStep = 3; executeStep(); }
              }, 1200);
            });
          });
          break;

        case 3:
          // Passo 3: Avançar para a tela de agendamento no WhatsApp
          scrollCatalogToSection(3, () => {
            moveTouch(195, 580, 800, () => {
              tapTouch(() => {
                stepTimer = setTimeout(() => {
                  if (isRunning) { animStep = 4; executeStep(); }
                }, 1600);
              });
            });
          });
          break;

        case 4:
          // Passo 4: Retornar suavemente ao topo e repetir o ciclo de gravação
          hideTouch();
          resetCatalogToTop(() => {
            animStep = 0;
            stepTimer = setTimeout(() => {
              if (isRunning) executeStep();
            }, 1800);
          });
          break;
      }
    }

    function startSimulation() {
      if (isRunning) return;
      isRunning = true;
      btnPlay.style.display = 'none';
      btnPause.style.display = 'inline-flex';
      executeStep();
    }

    function pauseSimulation() {
      isRunning = false;
      if (stepTimer) clearTimeout(stepTimer);
      btnPlay.style.display = 'inline-flex';
      btnPause.style.display = 'none';
      hideTouch();
    }

    function resetSimulation() {
      pauseSimulation();
      animStep = 0;
      hideTouch();
      resetCatalogToTop();
    }

    btnPlay.addEventListener('click', startSimulation);
    btnPause.addEventListener('click', pauseSimulation);
    btnReset.addEventListener('click', resetSimulation);
  </script>
</body>

</html>
