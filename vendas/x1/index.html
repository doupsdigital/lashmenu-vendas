<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>LashMenu — Playbook de Vendas X1 WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Sticky Top Header -->
  <header class="playbook-header">
    <div class="container">
      <div class="header-top">
        <a href="/" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          <span>Painel Principal</span>
        </a>
        <span class="brand-badge">💬 Playbook X1 VIP</span>
      </div>

      <h1 class="header-title">Playbook de Vendas <em>WhatsApp X1</em></h1>

      <!-- Instant Search Bar -->
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar script por palavra (ex: caro, pix, canva, instagram)...">
      </div>

      <!-- Filter Pills (Abas de Categorias) -->
      <div class="filter-pills">
        <button type="button" class="pill-btn is-active" data-category="all">⚡ Todos os Scripts</button>
        <button type="button" class="pill-btn" data-category="funnel">🎯 Funil Lead do Anúncio (Passo a Passo)</button>
        <button type="button" class="pill-btn" data-category="inbound">📩 Respostas Rápidas Anúncio</button>
        <button type="button" class="pill-btn" data-category="outbound">🚀 Abordagem Fria</button>
        <button type="button" class="pill-btn" data-category="objecao">🛡️ Quebra de Objeções (Curtas)</button>
        <button type="button" class="pill-btn" data-category="fechamento">💰 Fechamento &amp; PIX</button>
        <button type="button" class="pill-btn" data-category="onboarding">📋 Envio Formulário</button>
        <button type="button" class="pill-btn" data-category="followup">🔄 Follow-up / Resgate Vácuo</button>
      </div>
    </div>
  </header>

  <!-- Main Content Section -->
  <main class="scripts-section">
    <div class="container">
      <div class="section-counter" id="script-counter">Carregando scripts...</div>

      <!-- Dynamic Scripts Container -->
      <div class="scripts-list" id="scripts-list"></div>
    </div>
  </main>

  <!-- Toast Notification Popup -->
  <div class="toast-notification" id="toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="toast-message">Texto copiado com sucesso!</span>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
