<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📱 Editor de Catálogo — LashMenu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0908;
      --card-bg: #14100f;
      --primary: #c04b6b;
      --primary-hover: #d96583;
      --text: #f5ede6;
      --muted: #a3958c;
      --border: rgba(229, 169, 184, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(20, 16, 15, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 100;
    }

    .brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }

    .brand em {
      font-style: italic;
      color: var(--primary);
    }

    .controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slug-select, .slug-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }

    .slug-select option {
      background: #14100f;
      color: #fff;
    }

    .btn-load {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-load:hover {
      background: var(--primary-hover);
    }

    main {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #0d0b0a;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0d0b0a;
    }
  </style>
</head>

<body>

  <header>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="brand">Lash<em>Menu</em></div>
    </div>

    <div class="controls-bar">
      <label style="font-size: 0.8rem; color: var(--muted);">Cliente:</label>
      <select id="slug-select" class="slug-select">
        <option value="marialuisa">Maria Luisa (marialuisa)</option>
        <option value="marianateste">Mariana Teste (marianateste)</option>
        <option value="juliaalvez">Julia Alves (juliaalvez)</option>
        <option value="camilarocha">Camila Rocha (camilarocha)</option>
        <option value="custom">Outro Slug...</option>
      </select>

      <input type="text" id="slug-input" class="slug-input" placeholder="Digite slug..." style="display: none; width: 140px;">
      <button class="btn-load" id="btn-load">Trocar</button>
    </div>
  </header>

  <main>
    <iframe id="editor-frame" src="about:blank"></iframe>
  </main>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const slugSelect = document.getElementById('slug-select');
      const slugInput = document.getElementById('slug-input');
      const btnLoad = document.getElementById('btn-load');
      const frame = document.getElementById('editor-frame');

      let currentSlug = urlParams.get('slug') || urlParams.get('c') || 'marialuisa';

      let foundOption = false;
      for (let opt of slugSelect.options) {
        if (opt.value === currentSlug) {
          opt.selected = true;
          foundOption = true;
          break;
        }
      }
      if (!foundOption) {
        slugSelect.value = 'custom';
        slugInput.value = currentSlug;
        slugInput.style.display = 'inline-block';
      }

      slugSelect.addEventListener('change', () => {
        if (slugSelect.value === 'custom') {
          slugInput.style.display = 'inline-block';
          slugInput.focus();
        } else {
          slugInput.style.display = 'none';
          loadEditor(slugSelect.value);
        }
      });

      function loadEditor(slug) {
        if (!slug) return;
        currentSlug = slug.toLowerCase().trim();
        const targetUrl = `../catalogo/?slug=${encodeURIComponent(currentSlug)}&mode=edit`;
        frame.src = targetUrl;

        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('slug', currentSlug);
        window.history.replaceState({}, '', newUrl);
      }

      btnLoad.addEventListener('click', () => {
        const selectedVal = slugSelect.value === 'custom' ? slugInput.value.trim() : slugSelect.value;
        loadEditor(selectedVal || 'marialuisa');
      });

      slugInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btnLoad.click();
      });

      loadEditor(currentSlug);
    })();
  </script>

</body>

</html>
