<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Carregando Catálogo Oficial — LashMenu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0d0b0a;
      color: #f5ede6;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #lashmenu-loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0b0a;
      color: #f5ede6;
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #lashmenu-loader-overlay .lm-brand {
      font-family: Georgia, serif;
      font-size: 2.2rem;
      letter-spacing: 0.15em;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    #lashmenu-loader-overlay .lm-brand em {
      font-style: italic;
      color: #e5a9b8;
    }
    #lashmenu-loader-overlay .lm-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(229,169,184,0.2);
      border-top-color: #e5a9b8;
      border-radius: 50%;
      animation: lmSpin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes lmSpin { to { transform: rotate(360deg); } }
    #lashmenu-loader-overlay .lm-status {
      color: #a3958c;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }
    .error-box {
      display: none;
      max-width: 400px;
      position: relative;
      z-index: 99999999;
      text-align: center;
      padding: 24px;
    }
    .error-box.is-active {
      display: block;
    }
    .error-box h2 {
      font-family: Georgia, serif;
      font-size: 2.2rem;
      color: #e5a9b8;
      margin-bottom: 12px;
    }
    .error-box p {
      color: #a3958c;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .error-box a {
      display: inline-block;
      padding: 12px 24px;
      background: #e5a9b8;
      color: #0d0b0a;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <div id="lashmenu-loader-overlay">
    <div class="lm-brand">Lash<em>Menu</em></div>
    <div class="lm-spinner"></div>
    <p class="lm-status">Carregando catálogo exclusivo...</p>
  </div>

  <div class="error-box" id="error-box">
    <h2>Catálogo Não Encontrado</h2>
    <p>O subdomínio informado não foi localizado ou ainda está sendo configurado.</p>
    <a href="../vendas/form/">Criar Catálogo</a>
  </div>

  <script>
    (async function routeToModel() {
      const loader = document.getElementById('loader-content');
      const errorBox = document.getElementById('error-box');

      function getSlug() {
        const urlParams = new URLSearchParams(window.location.search);
        const querySlug = urlParams.get('slug') || urlParams.get('c') || urlParams.get('p');
        if (querySlug) return querySlug.toLowerCase().trim();

        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (pathParts.length >= 2 && (pathParts[0] === 'catalogo' || pathParts[0] === 'c')) {
          return pathParts[1].toLowerCase().trim();
        }

        const hostname = window.location.hostname;
        const hostParts = hostname.split('.');
        if (hostParts.length >= 3 && hostParts[0] !== 'www' && hostParts[0] !== 'lashmenu-vendas') {
          return hostParts[0].toLowerCase().trim();
        }
        return null;
      }

      async function checkManualClientAndRedirect(slug) {
        try {
          const res = await fetch(`../clientes/${encodeURIComponent(slug)}/index.html`);
          if (res.status === 200) {
            window.location.replace(`../clientes/${encodeURIComponent(slug)}/index.html`);
            return true;
          }
        } catch (err) {
          console.warn("Erro ao verificar catálogo manual:", err);
        }
        return false;
      }

      const slug = getSlug();

      if (!slug) {
        if (loader) loader.style.display = 'none';
        if (errorBox) errorBox.classList.add('is-active');
        return;
      }

      try {
        const SUPABASE_URL = 'https://wffhptpsafllsmcsoiih.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmZmhwdHBzYWZsbHNtY3NvaWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODkyMTYsImV4cCI6MjEwMjg2NTIxNn0.nwpvIwl8V6_KGIp5e5oeraAcGyt3oo8Kdam2hp6ajSQ';

        const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?slug=eq.${encodeURIComponent(slug)}&select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!res.ok) throw new Error('Erro na busca');
        const orders = await res.json();

        if (!orders || orders.length === 0) {
          const foundManual = await checkManualClientAndRedirect(slug);
          if (foundManual) return;

          if (loader) loader.style.display = 'none';
          if (errorBox) errorBox.classList.add('is-active');
          return;
        }

        const order = orders[0];
        const model = order.model_id || 'glamour';
        const color = order.color_id || 'midnight';
        const targetFolder = `${model}-${color}`;

        // Salva dados no cache da sessão para carregamento instantâneo no template
        try {
          const svcRes = await fetch(`${SUPABASE_URL}/rest/v1/order_services?order_id=eq.${order.id}&order_index=gte.0&order=order_index.asc`, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
          const services = svcRes.ok ? await svcRes.json() : [];
          sessionStorage.setItem(`lash_cache_${slug}`, JSON.stringify({ order, services }));
        } catch (svcErr) {}

        // Redireciona para o modelo oficial intacto passando o slug
        window.location.replace(`../${targetFolder}/?slug=${encodeURIComponent(slug)}`);

      } catch (e) {
        const foundManual = await checkManualClientAndRedirect(slug);
        if (foundManual) return;

        if (loader) loader.style.display = 'none';
        if (errorBox) errorBox.classList.add('is-active');
      }
    })();
  </script>
</body>

</html>
